# Generates a stats/activity/languages image and commits it into YOUR OWN repo
# as metrics.svg, instead of loading it from a shared third-party server.
# This is the same "self-hosted" pattern as the snake workflow, and it's the
# permanent fix for the stat cards that kept breaking.
#
# SETUP:
# 1. Create a Personal Access Token so the action can read your GitHub data:
#      GitHub → Settings → Developer settings → Personal access tokens →
#      Tokens (classic) → Generate new token
#      Scopes needed: repo, read:user
# 2. In your NIGHTFURY-999/NIGHTFURY-999 repo: Settings → Secrets and
#    variables → Actions → New repository secret
#      Name:  METRICS_TOKEN
#      Value: (paste the token from step 1)
# 3. Save this file as .github/workflows/metrics.yml in that repo (same way
#    you added snake.yml) and push it.
# 4. Go to the Actions tab → "Generate Metrics" → Run workflow, to trigger it
#    the first time instead of waiting for the daily schedule.
# 5. Once it finishes, metrics.svg will exist at the root of your repo, and
#    the README already points at it:
#      https://raw.githubusercontent.com/NIGHTFURY-999/NIGHTFURY-999/main/metrics.svg

name: Generate Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NIGHTFURY-999
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
